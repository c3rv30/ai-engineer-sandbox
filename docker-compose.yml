services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
      # La lee 01_init.sql para sembrar la clave con la que las políticas RLS verifican
      # la firma del tenant (SEC-05). Sale del .env del proyecto y es la misma que usa
      # la aplicación; sin ella, compose se niega a arrancar en vez de crear una base
      # con la que la aplicación no podría leer ni una fila.
      TENANT_SIGNING_KEY: ${TENANT_SIGNING_KEY:?define TENANT_SIGNING_KEY en .env (openssl rand -hex 32)}
    ports:
      - "5433:5432"
    volumes:
      # Sobre un volumen vacío se ejecutan los .sql de este directorio en orden
      # alfabético; los subdirectorios (sql/migrations/) se ignoran.
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      # Por TCP a propósito: mientras corren los scripts de inicialización el servidor
      # temporal solo escucha en el socket Unix, así que 'healthy' significa que ya
      # terminaron. Si fallan, el contenedor sale en lugar de quedar 'healthy'.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
