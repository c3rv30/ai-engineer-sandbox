services:
  postgres:
    image: pgvector/pgvector:pg16
    # Without a restart policy, restarting Docker Desktop or the machine left the
    # database stopped and the API failing with connection refused on 5433 (HYG-06). A
    # manual `docker stop` or `compose stop` is still respected.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
      # Read by 01_init.sql to seed the key the RLS policies use to verify the tenant's
      # signature (SEC-05). It comes from the project's .env and is the same one the
      # application uses; without it, compose refuses to start instead of creating a
      # database the application could not read a single row from.
      TENANT_SIGNING_KEY: ${TENANT_SIGNING_KEY:?set TENANT_SIGNING_KEY in .env (openssl rand -hex 32)}
    ports:
      - "5433:5432"
    volumes:
      # On an empty volume, the .sql files in this directory run in alphabetical
      # order; subdirectories (sql/migrations/) are ignored.
      - ./sql:/docker-entrypoint-initdb.d
      # Named volume for the data (HYG-08). Without this line, the image declares a
      # VOLUME on this path and Docker created an anonymous one: the data persisted in a
      # volume named by a hash, which `compose down` orphaned and the next `up`
      # replaced with an empty one, without anything failing.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: while the init scripts run, the temporary server only
      # listens on the Unix socket, so 'healthy' means they have finished. If they fail,
      # the container exits instead of staying 'healthy'.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
