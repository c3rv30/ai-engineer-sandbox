[project]
name = "ai-engineer-sandbox"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic==1.4.0",
    "asyncpg>=0.31.0",
    "deepeval==4.2.1",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "instructor>=1.16.0",
    "langchain-core>=1.6.2",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit==1.63.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# Solo tests/: la raíz tiene scripts sueltos test_*.py que hacen peticiones o cargan
# modelos al importarse (HYG-02).
testpaths = ["tests"]
# Equivale al PYTHONPATH=. con que el README arranca la API y la ingesta.
pythonpath = ["."]
# deepeval registra un plugin que pytest carga siempre (~1,7 s, importa anthropic y
# openai). La evaluación de tests/evals/ no lo necesita: assert_test funciona sin él.
addopts = ["--strict-markers", "-p", "no:deepeval"]
markers = [
    "db: necesita la base PostgreSQL desechable que levanta tests/db/conftest.py",
    "eval: evaluación de calidad con juez LLM; solo se recoge con --run-evals",
    "api: ejercita la API con TestClient y dobles del grafo y de los servicios; no necesita Docker",
]
asyncio_mode = "auto"
# Un único event loop para toda la sesión: el pool de src/services/db.py es uno por
# loop, y un loop por test crearía un pool por test sin cerrar los anteriores.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
