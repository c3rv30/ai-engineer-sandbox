[project]
name = "ai-engineer-sandbox"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic==1.4.0",
    "asyncpg>=0.31.0",
    "deepeval==4.2.1",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "instructor>=1.16.0",
    "langchain-core>=1.6.2",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "lingua-language-detector==2.2.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit==1.63.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# Only tests/: the root used to have loose test_*.py scripts that made requests or
# loaded models at import time (HYG-02).
testpaths = ["tests"]
# Same as the PYTHONPATH=. the README uses to start the API and the ingestion.
pythonpath = ["."]
# deepeval registers a plugin that pytest always loads (~1.7 s, it imports anthropic
# and openai). The evaluation in tests/evals/ does not need it: assert_test works without it.
addopts = ["--strict-markers", "-p", "no:deepeval"]
markers = [
    "db: needs the disposable PostgreSQL database started by tests/db/conftest.py",
    "eval: quality evaluation with an LLM judge; only collected with --run-evals",
    "api: exercises the API with TestClient and doubles for the graph and the services; no Docker needed",
]
asyncio_mode = "auto"
# A single event loop for the whole session: the pool in src/services/db.py is one per
# loop, and one loop per test would create a pool per test without closing the previous ones.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
